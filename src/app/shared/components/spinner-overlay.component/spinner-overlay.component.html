@if(loadingService.loading()) {
  <div class="hud-spinner-overlay">
    <svg class="hud-spinner" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" class="ring" />
      <circle cx="50" cy="50" r="5" class="core" />

      <circle cx="50" cy="10" r="1.5" class="orbit-dot" />
      <circle cx="90" cy="50" r="1.5" class="orbit-dot delay-1" />
      <circle cx="50" cy="90" r="1.5" class="orbit-dot delay-2" />
      <circle cx="10" cy="50" r="1.5" class="orbit-dot delay-3" />

      <g class="lines">
        <line x1="50" y1="10" x2="50" y2="0" />
        <line x1="50" y1="90" x2="50" y2="100" />
        <line x1="10" y1="50" x2="0" y2="50" />
        <line x1="90" y1="50" x2="100" y2="50" />
      </g>
    </svg>

    <div class="hud-text">
      {{ 'loading.title' | translate }}
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>
}
