name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Build Angular app
        run: npm run build -- --configuration production

      - name: 🧹 Limpiar carpeta destino en el VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            rm -rf /var/www/frontend/rpvai.com/*
            mkdir -p /var/www/frontend/rpvai.com

      - name: 📤 Enviar archivos con rsync (solo contenido de browser/)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 22" dist/landing-page-rpv/browser/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/frontend/rpvai.com/

      - name: ✅ Confirmación
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            echo "✅ Frontend actualizado correctamente"
