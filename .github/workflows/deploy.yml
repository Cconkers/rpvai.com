name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Build Angular app
        run: npm run build -- --configuration production

      - name: 🚀 Rsync al servidor VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            # Limpiar contenido anterior
            rm -rf /var/www/frontend/rpvai.com/*
            # Crear carpeta destino por si acaso no existe
            mkdir -p /var/www/frontend/rpvai.com
        env:
          RSYNC_RSH: "ssh -i ~/.ssh/id_rsa -p 22"

      - name: 📤 Enviar archivos con rsync (contenido de browser)
        run: |
          rsync -avz dist/landing-page-rpv/browser/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/frontend/rpvai.com/
        env:
          RSYNC_RSH: "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 22"

      - name: ✅ Confirmación
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            echo "✅ Frontend actualizado correctamente"
